name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Emacs ${{ matrix.emacs-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - "28.1"
          - "29.4"
          - "30.2"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Emacs ${{ matrix.emacs-version }}
        uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile with warnings as errors
        run: >-
          emacs -Q --batch -L .
          --eval '(setq byte-compile-error-on-warn t)'
          -f batch-byte-compile
          elisp-eval.el elisp-eval-tests.el

      - name: Run ERT tests
        run: >-
          emacs -Q --batch -L .
          -l elisp-eval-tests.el
          -f ert-run-tests-batch-and-exit
